{% extends "base.html" %}
{% block titulo %}Crear cuenta{% endblock %}
{% block contenido %}
<section class="tarjeta-formulario">
    <h1>Crear cuenta</h1>
    {% if error %}<p class="aviso error">{{ error }}</p>{% endif %}
    <form method="post" action="/registro">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autofocus>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="contrasena">Contrasena</label>
        <input type="password" id="contrasena" name="contrasena" required minlength="8">

        <label for="confirmar">Confirmar contrasena</label>
        <input type="password" id="confirmar" name="confirmar" required minlength="8">

        <button type="submit" class="boton">Crear cuenta</button>
    </form>
    <p>Las cuentas nuevas quedan con rol QA. El rol de administrador se asigna aparte.</p>
    <p>¿Ya tienes cuenta? <a href="/login">Ingresa</a></p>
</section>
{% endblock %}
