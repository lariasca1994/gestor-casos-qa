{% extends "base.html" %}
{% block titulo %}Cambiar contraseña · Gestor QA{% endblock %}
{% block contenido %}
<section class="cabecera-seccion">
    <h1>Cambiar contraseña</h1>
</section>
<section class="tarjeta">
    {% if error %}<p class="aviso error" role="alert">{{ error }}</p>{% endif %}
    {% if exito %}<p class="aviso exito" role="status">{{ exito }}</p>{% endif %}
    <form method="post" action="/cuenta/contrasena">
        <label for="actual">Contraseña actual</label>
        <input type="password" id="actual" name="actual" autocomplete="current-password" required>
        <label for="contrasena">Nueva contraseña (mínimo 8 caracteres)</label>
        <input type="password" id="contrasena" name="contrasena" minlength="8" autocomplete="new-password" required>
        <label for="confirmar">Confirma la nueva contraseña</label>
        <input type="password" id="confirmar" name="confirmar" minlength="8" autocomplete="new-password" required>
        <button type="submit" class="boton">Guardar contraseña</button>
    </form>
</section>
{% endblock %}
