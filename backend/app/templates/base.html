<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Gestor de Casos de Prueba QA{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body>
    <header class="barra">
        {% include "fragmentos/cabecera.html" %}
        <nav class="nav-principal">
            {% if usuario %}
                <a href="/proyectos">Proyectos</a>
                <span class="rol-actual">{{ usuario.rol }}</span>
                <a href="/logout">Salir ({{ usuario.nombre }})</a>
            {% else %}
                <a href="/login">Ingresar</a>
                <a href="/registro">Registrarme</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
    <footer class="pie">
        <p>Gestor de Casos de Prueba QA &mdash; proyecto de portafolio de Luis Felipe Arias.</p>
    </footer>
    <script src="/static/js/tema.js" defer></script>
</body>
</html>
